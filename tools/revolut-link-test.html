<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revolut link test</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f1ea; --ink: #1d2420; --line: #d9d3c4; --card: #fffdf7; --accent: #2e6b4f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151a17; --ink: #e8ebe6; --line: #34403a; --card: #1d2420; --accent: #8fc7a8; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, sans-serif; }
  main { max-width: 480px; margin: 0 auto; }
  a.test { display: block; margin: 10px 0; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--ink); text-decoration: none; font-weight: 650; }
  a.test span { display: block; font-weight: 400; font-size: 0.85rem; opacity: 0.7; word-break: break-all; }
  .result { padding: 12px 16px; border-radius: 10px; background: var(--card); border: 1px solid var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Which link opens Revolut?</h1>
  <p>Tap each one, then come back here with the Back button. Note which letters open the <b>Revolut app itself</b>
    (not the Play Store, not a web page).</p>
  <p class="result" id="result" hidden></p>
  <div id="links"></div>
</main>
<script>
  const back = (id) => encodeURIComponent(location.href.split('?')[0] + '?failed=' + id);
  const tests = [
    ['A', 'revolut:// with package', `intent://#Intent;scheme=revolut;package=com.revolut.revolut;S.browser_fallback_url=${back('A')};end`],
    ['B', 'revolut:// plain', 'revolut://'],
    ['C', 'revolut.me', 'https://revolut.me/'],
    ['D', 'revolut.com/app', 'https://www.revolut.com/app/'],
    ['E', 'revolut.com app button page', 'https://www.revolut.com/not-a-web-link/'],
  ];
  document.getElementById('links').innerHTML = tests.map(([id, name, href]) =>
    `<a class="test" href="${href}">${id}. ${name}<span>${href.replace(/S\.browser_fallback_url=[^;]*;/, '')}</span></a>`).join('');
  const failed = new URLSearchParams(location.search).get('failed');
  if (failed) {
    const r = document.getElementById('result');
    r.hidden = false;
    r.textContent = `${failed} did not open Revolut.`;
  }
</script>
</body>
</html>
